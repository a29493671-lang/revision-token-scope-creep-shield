services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revision-shield-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/revision_shield.db
    volumes:
      - revision_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: revision-shield-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  revision_data:
